<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Break Time Cary - Table Status</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1F6F4A 0%, #16502F 100%);
            min-height: 100vh;
            padding: 20px;
            user-select: none;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #1F6F4A 0%, #16502F 100%);
            color: white;
            padding: 24px 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 26px;
            margin-bottom: 6px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .nav-link {
            display: inline-block;
            margin-top: 12px;
            color: white;
            opacity: 0.85;
            font-size: 13px;
            text-decoration: underline;
        }

        .content {
            padding: 30px;
        }

        .login-section {
            max-width: 400px;
            margin: 20px auto;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #1F6F4A;
            box-shadow: 0 0 0 3px rgba(31, 111, 74, 0.1);
        }

        .btn {
            background: linear-gradient(135deg, #1F6F4A 0%, #16502F 100%);
            color: white;
            padding: 14px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }

        .btn-secondary {
            background: #6c757d;
        }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .alert.show {
            display: block;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .hidden {
            display: none;
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-bottom: 24px;
            font-size: 13px;
            color: #555;
        }

        .legend span {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
        }

        .dot.green { background: #2ecc71; }
        .dot.red { background: #e74c3c; }

        .tables-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 16px;
        }

        .table-btn {
            aspect-ratio: 1;
            border: none;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            transition: transform 0.1s;
            color: white;
        }

        .table-btn:active {
            transform: scale(0.95);
        }

        .table-btn.available {
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
        }

        .table-btn.rented {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
        }

        .table-btn.saving {
            opacity: 0.6;
        }

        .table-number {
            font-size: 34px;
            font-weight: 800;
        }

        .table-status {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .footer-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 30px;
            gap: 12px;
        }

        .last-updated {
            font-size: 12px;
            color: #999;
        }

        @media (max-width: 500px) {
            .tables-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎱 Table Status</h1>
            <p>Break Time Cary — tap a table to toggle rented / available</p>
            <a class="nav-link" href="index.html">Go to Specials admin →</a>
        </div>

        <!-- Login Section -->
        <div id="loginSection" class="content login-section">
            <div class="form-group">
                <label for="ghToken">Access Token</label>
                <input type="password" id="ghToken" placeholder="Enter your access token">
            </div>
            <button class="btn" onclick="login()">Login</button>
            <div id="loginError" class="alert alert-error"></div>

            <div style="margin-top: 20px; padding: 15px; background: #f8f9fa; border-radius: 8px; font-size: 13px;">
                <strong>Same access token as the Specials page.</strong>
            </div>
        </div>

        <!-- Main Content -->
        <div id="mainContent" class="content hidden">
            <div id="alertBox" class="alert"></div>

            <div class="legend">
                <span><span class="dot green"></span> Available to rent</span>
                <span><span class="dot red"></span> Currently rented</span>
            </div>

            <div id="tablesGrid" class="tables-grid"></div>

            <div class="footer-actions">
                <span class="last-updated" id="lastUpdated"></span>
                <button class="btn btn-secondary" style="width: auto; margin-top: 0;" onclick="logout()">Logout</button>
            </div>
        </div>
    </div>

    <script>
        const REPO = 'ncponyboy/Breaktime-Cary-Specials';
        let ghToken = localStorage.getItem('breaktimeSpecialsToken');
        let tables = [];
        let savingInFlight = false;

        if (ghToken) {
            showMainContent();
            loadTables();
        }

        async function login() {
            const token = document.getElementById('ghToken').value;
            if (!token) {
                showError('loginError', 'Please enter your access token');
                return;
            }

            try {
                const response = await fetch(`https://api.github.com/repos/${REPO}/contents/tables.json`, {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });

                if (response.ok) {
                    localStorage.setItem('breaktimeSpecialsToken', token);
                    ghToken = token;
                    showMainContent();
                    loadTables();
                } else {
                    showError('loginError', 'Invalid access token');
                }
            } catch (error) {
                showError('loginError', 'Connection error. Please check your token.');
            }
        }

        function logout() {
            localStorage.removeItem('breaktimeSpecialsToken');
            ghToken = null;
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('mainContent').classList.add('hidden');
        }

        function showMainContent() {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('mainContent').classList.remove('hidden');
        }

        function showAlert(message, isError = false) {
            const alertBox = document.getElementById('alertBox');
            alertBox.textContent = message;
            alertBox.className = `alert ${isError ? 'alert-error' : 'alert-success'} show`;
            setTimeout(() => alertBox.classList.remove('show'), 4000);
        }

        function showError(elementId, message) {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.classList.add('show');
            setTimeout(() => element.classList.remove('show'), 5000);
        }

        async function loadTables() {
            try {
                const response = await fetch(`https://raw.githubusercontent.com/${REPO}/main/tables.json?t=${Date.now()}`);
                const data = await response.json();
                tables = data.tables || [];
                renderLastUpdated(data.last_updated);
                renderTables();
            } catch (error) {
                document.getElementById('tablesGrid').innerHTML = '<p style="color:#999;">Error loading tables</p>';
            }
        }

        function renderLastUpdated(iso) {
            const el = document.getElementById('lastUpdated');
            if (!iso) { el.textContent = ''; return; }
            el.textContent = `Last updated ${new Date(iso).toLocaleTimeString()}`;
        }

        function renderTables() {
            const grid = document.getElementById('tablesGrid');
            grid.innerHTML = tables
                .sort((a, b) => a.number - b.number)
                .map(t => `
                    <button class="table-btn ${t.available ? 'available' : 'rented'}" onclick="toggleTable(${t.number})">
                        <span class="table-number">${t.number}</span>
                        <span class="table-status">${t.available ? 'Available' : 'Rented'}</span>
                    </button>
                `).join('');
        }

        async function toggleTable(number) {
            if (savingInFlight) return;

            const table = tables.find(t => t.number === number);
            if (!table) return;

            // Optimistic UI update
            table.available = !table.available;
            renderTables();

            savingInFlight = true;
            const success = await saveTables();
            savingInFlight = false;

            if (success) {
                showAlert(`Table ${number} marked ${table.available ? 'available' : 'rented'}. May take a few minutes to appear in the app.`);
            } else {
                // Revert on failure
                table.available = !table.available;
                renderTables();
                showAlert('Error saving — please try again.', true);
            }
        }

        async function saveTables() {
            const nowIso = new Date().toISOString();
            const data = { tables, last_updated: nowIso };

            try {
                const getResponse = await fetch(`https://api.github.com/repos/${REPO}/contents/tables.json`, {
                    headers: {
                        'Authorization': `Bearer ${ghToken}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });

                if (!getResponse.ok) return false;

                const currentFile = await getResponse.json();
                const sha = currentFile.sha;
                const content = btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2))));

                const updateResponse = await fetch(`https://api.github.com/repos/${REPO}/contents/tables.json`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${ghToken}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `Update table status from admin`,
                        content: content,
                        sha: sha
                    })
                });

                if (updateResponse.ok) {
                    renderLastUpdated(nowIso);
                }

                return updateResponse.ok;
            } catch (error) {
                console.error('Save error:', error);
                return false;
            }
        }
    </script>
</body>
</html>
